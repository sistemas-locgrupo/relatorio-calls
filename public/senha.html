<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trocar senha · Relatório de Calls</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0256C6">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="auth.css">
<style>.pag{max-width:460px}</style>
</head>
<body>
<header class="topo">
  <div><img src="logo.png" alt="locagora"><div class="sub">Relatório de Calls</div></div>
  <a class="btn" href="/" id="voltar">Voltar ao relatório</a>
</header>
<main class="pag">
  <form class="cartao" id="f" novalidate>
    <h2 id="tit">Trocar senha</h2>
    <p class="desc" id="desc">Escolha uma senha nova com pelo menos 8 caracteres.</p>
    <div class="msg" id="msg" role="alert"></div>
    <div class="campo"><label for="atual">Senha atual</label>
      <div class="senha-wrap"><input id="atual" type="password" autocomplete="current-password" required><button class="ver" type="button" data-ver="atual">Mostrar</button></div></div>
    <div class="campo"><label for="nova">Nova senha</label>
      <div class="senha-wrap"><input id="nova" type="password" autocomplete="new-password" required><button class="ver" type="button" data-ver="nova">Mostrar</button></div></div>
    <div class="campo"><label for="nova2">Confirme a nova senha</label><input id="nova2" type="password" autocomplete="new-password" required></div>
    <button class="btn prim cheio" type="submit" id="b">Salvar nova senha</button>
  </form>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const p = new URLSearchParams(location.search);
  const volta = (v => v && v.startsWith('/') && !v.startsWith('//') ? v : '/')(p.get('volta'));
  $('voltar').href = volta;
  if (p.get('primeiro')) {
    $('tit').textContent = 'Crie sua senha';
    $('desc').textContent = 'Você entrou com uma senha provisória. Troque por uma senha só sua para continuar.';
    document.querySelector('label[for=atual]').textContent = 'Senha provisória';
  }
  document.querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => {
    const i = $(b.dataset.ver); const vis = i.type === 'password';
    i.type = vis ? 'text' : 'password'; b.textContent = vis ? 'Ocultar' : 'Mostrar';
  }));
  const msg = (t, tipo) => { $('msg').textContent = t || ''; $('msg').className = 'msg' + (t ? ' ' + (tipo || 'erro') : ''); };
  $('atual').focus();
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    if ($('nova').value !== $('nova2').value) return msg('As senhas novas não são iguais.');
    $('b').disabled = true; msg('');
    try {
      const r = await fetch('/api/senha', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ atual: $('atual').value, nova: $('nova').value }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) return location.replace('/login');
      if (!r.ok) throw new Error(j.erro || 'Não foi possível trocar a senha.');
      msg('Senha trocada. Voltando ao relatório…', 'ok');
      setTimeout(() => location.replace(volta), 900);
    } catch (e) { msg(e.message); $('b').disabled = false; }
  });
})();
</script>
</body>
</html>
